<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradView Demo — K 線展示</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        display: flex;
        flex-direction: column;
      }
      #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      #demo-footer {
        flex-shrink: 0;
        padding: 6px 12px;
        font-size: 11px;
        color: #8b949e;
        border-top: 1px solid #30363d;
        background: #161b22;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      #demo-error {
        display: none;
        padding: 8px 12px;
        background: #490202;
        color: #ffa198;
        font-size: 12px;
        border-bottom: 1px solid #f85149;
      }
    </style>
  </head>
  <body>
    <div id="demo-error"></div>
    <div id="app"></div>
    <!-- WebGL alpha (V2-R4b): open /webgl-demo.html — standalone renderer, not createChart -->
    <footer id="demo-footer">
      <span>按 ? 查看快捷鍵 · ↖ 選取/編輯繪圖 · 右側屬性欄 · ⚙ 設定（圖表/繪圖/指標）</span>
      <span>資料：mock gateway</span>
      <span id="demo-url"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
