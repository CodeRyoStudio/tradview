<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradView — Workspace + Bridge 3</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 100%; height: 100%; background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; }
      #toolbar { padding: 8px 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #30363d; }
      #workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
      .slot { min-height: 280px; border: 1px solid #30363d; border-radius: 6px; }
      label { font-size: 12px; display: flex; gap: 4px; align-items: center; }
      button { font-size: 12px; padding: 4px 10px; cursor: pointer; }
      #log { font-size: 11px; color: #8b949e; max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      body { display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <strong>ChartWorkspace + Bridge 3</strong>
      <label><input type="checkbox" id="sync-crosshair" checked /> crosshair</label>
      <label><input type="checkbox" id="sync-interval" checked /> interval</label>
      <button type="button" id="btn-workspace-ready">host.workspace (ready)</button>
      <span id="log">waiting…</span>
    </div>
    <div id="workspace"></div>
    <script type="module" src="/src/workspace-shell.ts"></script>
  </body>
</html>
