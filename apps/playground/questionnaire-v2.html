<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradView 2.x 使用情境問卷</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        line-height: 1.45;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 12px 20px;
        border-bottom: 1px solid #30363d;
        background: #161b22;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header .meta { font-size: 12px; color: #8b949e; }
      header button {
        margin-left: auto;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #30363d;
        background: #21262d;
        color: #e6edf3;
        cursor: pointer;
        font-size: 13px;
      }
      header button.primary { background: #238636; border-color: #238636; }
      header button:hover { filter: brightness(1.08); }
      main { max-width: 920px; margin: 0 auto; padding: 20px 20px 80px; }
      section {
        margin-bottom: 28px;
        padding: 18px 20px;
        border: 1px solid #30363d;
        border-radius: 8px;
        background: #161b22;
      }
      section h2 {
        font-size: 15px;
        margin: 0 0 4px;
        color: #58a6ff;
      }
      section .hint { font-size: 12px; color: #8b949e; margin-bottom: 14px; }
      .field { margin-bottom: 14px; }
      .field label.title { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
      .field input[type='text'],
      .field textarea {
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #e6edf3;
        font: inherit;
      }
      .field textarea { min-height: 72px; resize: vertical; }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #30363d;
        background: #0d1117;
        cursor: pointer;
        font-size: 13px;
        user-select: none;
      }
      .chip:has(input:checked) {
        border-color: #388bfd;
        background: #13253f;
      }
      .chip input { accent-color: #388bfd; }
      .rating-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
        align-items: start;
        padding: 10px 0;
        border-bottom: 1px solid #21262d;
        font-size: 13px;
      }
      .rating-row:last-child { border-bottom: none; }
      .rating-row .id { color: #8b949e; font-size: 11px; }
      .rating-options {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .rating-options label {
        display: inline-flex;
        align-items: center;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 12px;
      }
      .rating-options label:has(input:checked) {
        border-color: #388bfd;
        background: #13253f;
      }
      .rating-options input { margin-right: 4px; accent-color: #388bfd; }
      .branch { display: none; }
      .branch.visible { display: block; }
      #output-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 42vh;
        background: #161b22;
        border-top: 1px solid #30363d;
        display: none;
        flex-direction: column;
      }
      #output-panel.open { display: flex; }
      #output-panel .bar {
        padding: 8px 16px;
        display: flex;
        gap: 8px;
        align-items: center;
        border-bottom: 1px solid #30363d;
        font-size: 13px;
      }
      #output-panel pre {
        margin: 0;
        padding: 12px 16px;
        overflow: auto;
        font-size: 12px;
        flex: 1;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .progress { font-size: 12px; color: #8b949e; }
    </style>
  </head>
  <body>
    <header>
      <h1>TradView 2.x 使用情境問卷</h1>
      <span class="meta">對齊 v2.0.1 · 點選即存本機</span>
      <span class="progress" id="progress"></span>
      <button type="button" id="btn-clear">清除本機紀錄</button>
      <button type="button" id="btn-export" class="primary">產生摘要 / 複製</button>
    </header>
    <main>
      <form id="form"></form>
    </main>
    <div id="output-panel">
      <div class="bar">
        <strong>問卷摘要</strong>
        <button type="button" id="btn-copy">複製</button>
        <button type="button" id="btn-close-panel">關閉</button>
      </div>
      <pre id="output-text"></pre>
    </div>
    <script type="module" src="/src/questionnaire-v2.ts"></script>
  </body>
</html>
