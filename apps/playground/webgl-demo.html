<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradView — WebGL Alpha Demo (V2-R4b)</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        display: flex;
        flex-direction: column;
      }
      header {
        flex-shrink: 0;
        padding: 10px 16px;
        border-bottom: 1px solid #30363d;
        background: #161b22;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
      }
      header .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        background: #238636;
        color: #fff;
      }
      header p {
        font-size: 12px;
        color: #8b949e;
        flex: 1;
        min-width: 200px;
      }
      #chart-root {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      #hud {
        flex-shrink: 0;
        padding: 6px 16px;
        font-size: 11px;
        color: #8b949e;
        border-top: 1px solid #30363d;
        font-family: ui-monospace, monospace;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      #error {
        display: none;
        padding: 12px 16px;
        background: #490202;
        color: #ffa198;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WebGL Alpha</h1>
      <span class="badge">phase_alpha</span>
      <p>
        Standalone <code>@coderyo/renderer-webgl</code> demo — drag to pan, wheel to zoom.
        Does not use <code>createChart</code>.
      </p>
    </header>
    <div id="error" role="alert"></div>
    <div id="chart-root"></div>
    <div id="hud">
      <span id="hud-bars">bars: —</span>
      <span id="hud-viewport">viewport: —</span>
      <span id="hud-spacing">barSpacing: —</span>
    </div>
    <script type="module" src="/src/webgl-demo.ts"></script>
  </body>
</html>
