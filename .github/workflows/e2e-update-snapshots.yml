name: Update E2E snapshots

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @coderyo/playground build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: tests/e2e-visual
      - run: pnpm --filter @tradview/e2e-visual exec playwright test --update-snapshots
        env:
          CI: '1'

      - name: Upload snapshot baselines
        uses: actions/upload-artifact@v4
        with:
          name: e2e-snapshots
          path: tests/e2e-visual/specs/**/*-snapshots/**
          if-no-files-found: error