name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:rc

  e2e-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @coderyo/playground build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: tests/e2e-visual
      - name: Pixel regression (DESIGN-v2 §10.4)
        run: pnpm test:e2e-visual
        env:
          CI: '1'

  android-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Android sample
        working-directory: apps/sample-android
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          else
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          fi